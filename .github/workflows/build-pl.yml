name: Build PdfCraft PL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 1. Pobierz kod z Twojego repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Zaaplikuj obsługę Unicode z PR #3335 (jeśli pracujesz na main)
        shell: pwsh
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git fetch https://github.com/storytold/pdfcraft.git pull/3335/head:pr-3335
          # Przełączamy się na kod z PR #3335 i nakładamy Twoje zmiany z VS Code:
          git checkout pr-3335
          git checkout main -- crates/ocr/src/lib.rs

      - name: 3. Zainstaluj najnowszy Rust (1.95+)
        uses: dtolnay/rust-toolchain@stable

      - name: 4. Pobierz modele neuronowe (xtask)
        shell: pwsh
        run: cargo xtask models

      - name: 5. Kompiluj pdfcraft.exe oraz pdfcraft-cli.exe
        shell: pwsh
        run: cargo build --release -p pdfcraft -p pdfcraft-cli

      - name: 6. Spakuj gotowe pliki .exe do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: pdfcraft-pl-windows
          path: |
            target/release/pdfcraft.exe
            target/release/pdfcraft-cli.exe