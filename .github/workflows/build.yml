name: Kompiluj PdfCraft v0.21.1 PL (Windows)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 1. Pobierz najnowszy kod PdfCraft v0.21.1 (storytold/pdfcraft main)
        uses: actions/checkout@v4
        with:
          repository: storytold/pdfcraft
          ref: main

      - name: 2. Dodaj jezyk polski (pl / pol) do Tesseracta i automatyzacji
        shell: pwsh
        run: |
          # 1. Dodanie ("pl", "pol") oraz ("pl", "Polish") w crates/ocr/src/tesseract.rs
          $tessFile = "crates/ocr/src/tesseract.rs"
          $content = Get-Content $tessFile -Raw
          $content = $content -replace '\("nl",\s*"nld"\),', '("nl", "nld"), ("pl", "pol"),'
          $content = $content -replace '\("nl",\s*"Dutch"\),', '("nl", "Dutch"), ("pl", "Polish"),'
          
          if ($content -notmatch '"pol"' -or $content -notmatch '"Polish"') {
            throw "Nie udalo sie dopisac jezyka polskiego do tesseract.rs!"
          }
          Set-Content $tessFile $content -NoNewline

          # 2. Odblokowanie "pl" w schematach CLI/automatyzacji (tam gdzie jest lista z "nl")
          Get-ChildItem -Path "crates/automation/src" -Filter "*.rs" -Recurse | ForEach-Object {
            $c = Get-Content $_.FullName -Raw
            if ($c -match '"nl"' -and $c -notmatch '"pl"') {
              $c = $c -replace '"nl"', '"nl", "pl"'
              Set-Content $_.FullName $c -NoNewline
              Write-Host "Zaktualizowano schemat w:" $_.FullName
            }
          }

      - name: 3. Zainstaluj Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: 4. Pobierz modele bazowe
        run: cargo xtask models

      - name: 5. Kompiluj pdfcraft.exe i pdfcraft-cli.exe (v0.21.1)
        run: cargo build --release -p pdfcraft -p pdfcraft-cli

      - name: 6. Udostepnij gotowe pliki EXE
        uses: actions/upload-artifact@v4
        with:
          name: pdfcraft-0.21.1-pl-windows
          path: |
            target/release/pdfcraft.exe
            target/release/pdfcraft-cli.exe