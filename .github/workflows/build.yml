name: Kompiluj PdfCraft PL v0.21.1 (Windows)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 1. Pobierz najnowszy PdfCraft v0.21.1 (z oryginalnego repozytorium)
        uses: actions/checkout@v4
        with:
          repository: storytold/pdfcraft
          ref: main
          fetch-depth: 0

      - name: 2. Wstrzyknij polski OCR z Twojej galezi pl-ocr
        shell: pwsh
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
          # Pobierz Twoja wyedytowana galaz pl-ocr:
          git fetch https://github.com/${{ github.repository }}.git pl-ocr:my-pl-ocr
          
          # Podmien TYLKO modul OCR z Twojej galezi pl-ocr:
          git checkout my-pl-ocr -- crates/ocr
          
          # Odblokuj "pl" w najnowszym crates/automation (z wersji 0.21.1):
          Get-ChildItem -Path "crates/automation/src" -Filter "*.rs" -Recurse | ForEach-Object {
            $c = Get-Content $_.FullName -Raw
            if ($c -match '"enum":\s*\["en"\]') {
              $c = $c -replace '"enum":\s*\["en"\]', '"enum": ["en", "pl"]'
              Set-Content $_.FullName $c -NoNewline
            }
          }
            
      - name: 3. Zainstaluj Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: 4. Pobierz modele bazowe
        run: cargo xtask models

      - name: 5. Kompiluj pdfcraft.exe i pdfcraft-cli.exe (v0.21.1)
        run: cargo build --release -p pdfcraft -p pdfcraft-cli

      - name: 6. Udostepnij gotowe pliki EXE
        uses: actions/upload-artifact@v4
        with:
          name: pdfcraft-0.21.1-pl-windows
          path: |
            target/release/pdfcraft.exe
            target/release/pdfcraft-cli.exe.